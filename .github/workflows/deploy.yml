name: Deploy paper-notes to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # hooks.py 需要读取 git 提交时间

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install mkdocs-material mkdocs-glightbox jieba pymdown-extensions

      # 数据关系与计数先于构建：ID 唯一性、引用完整性、front matter 一致性（方案 H）
      - name: Validate structured data
        run: python tools/check_data.py

      - name: Build site (strict)
        run: python -m mkdocs build --strict

      # 严格构建检查 Markdown，但不会校验自定义钩子生成的重定向页；
      # 此步验证全部历史地址重定向的落点存在、无自环、数量达标，失败即中断发布。
      - name: Verify paper redirects
        run: python tools/check_redirects.py site

      # 只发布上面已通过严格构建与重定向校验的同一份 site/ 目录。
      # 不再用 mkdocs gh-deploy --force（它会重新构建，发布产物可能与检查产物不一致）。
      # ghp-import 是 mkdocs-material 的随附依赖；-n 写入 .nojekyll，-b 指定发布分支。
      - name: Deploy checked site/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m ghp_import -n -p -f -b gh-pages -m "Deploy ${GITHUB_SHA::7} from checked site/" site
