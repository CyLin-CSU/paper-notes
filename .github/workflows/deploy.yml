name: Deploy paper-notes to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # hooks.py 需要读取 git 提交时间

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install mkdocs-material mkdocs-glightbox jieba pymdown-extensions

      - name: Build site (strict)
        run: python -m mkdocs build --strict

      # 严格构建检查 Markdown，但不会校验自定义钩子生成的重定向页；
      # 此步验证全部历史地址重定向的落点存在、无自环、数量达标，失败即中断发布。
      - name: Verify paper redirects
        run: python tools/check_redirects.py site

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m mkdocs gh-deploy --force
