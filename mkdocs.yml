site_name: Paper Notes · 论文阅读笔记
site_description: 我的论文精读总结库
repo_url: https://github.com/CyLin-CSU/paper-notes
repo_name: CyLin-CSU/paper-notes

hooks:
  - hooks.py
  - search_zh.py

theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换亮色

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/load-mathjax.js
  - javascripts/giscus.js
  - javascripts/progress.js
  - javascripts/back-to-top.js
  - https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js

plugins:
  - search
  - meta
  - glightbox

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - abbr
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - toc:
      permalink: "#"

exclude_docs: |
  includes/
  **/.history/**

nav:
  - 首页: index.md
  - 论文笔记:
      - 2023 · BIOT (NeurIPS): papers/0918-biot.md
      - 2023 · Défossez 语音解码 (NMI · 轴线源头): papers/1102-defossez-speech.md
      - 2024 · LaBraM (ICLR): papers/0918-labram.md
      - 2024 · EEGPT (NeurIPS): papers/0918-eegpt.md
      - 2024 · BrainGPT (arXiv): papers/0918-braingpt.md
      - 2024 · GUIDED (arXiv · 视觉重建): papers/1104-guided.md
      - 2024 · CrossPT-EEG (arXiv · 视觉解码基准): papers/1104-crosspt-eeg.md
      - 2025 · NeuroLM (ICLR): papers/0918-neurolm.md
      - 2025 · LUNA (NeurIPS · 拓扑无关): papers/0924-luna.md
      - 2025 · CBraMod (ICLR · 十字交叉): papers/0928-cbramod.md
      - 2025 · SSM2Mel (arXiv · 语音解码): papers/1102-ssm2mel.md
      - 2025 · NPI (Nature Methods · 连接组学): papers/1102-surrogate-brain.md
      - 2025 · NeuroRVQ (arXiv · 多尺度RVQ): papers/1104-neurorvq.md
      - 2025 · DELTA (NeurIPS WS · 掩码扩散EEG-to-Text): papers/1104-delta.md
      - 2026 · TFM-Tokenizer (ICLR): papers/0918-tfm-tokenizer.md
      - 2026 · RF-GPT (arXiv · 跨领域): papers/0921-rf-gpt.md
      - 2026 · JET (ICML · EEG 生成): papers/0923-jet.md
      - 2026 · EEGMoE (TNNLS · MoE): papers/0924-eegmoe.md
      - 2026 · EEGDM (arXiv · 扩散表征): papers/1017-eegdm.md
      - 2026 · Not-All-EEG (arXiv · 流匹配生成): papers/1028-not-all-eeg.md
      - 2026 · LTFT (IEEE TETCI · 时频方法): papers/1102-learnable-tf.md
      - 2026 · BrainRVQ (arXiv · 双域RVQ): papers/1104-brainrvq.md
      - 2026 · CodeBrain (ICLR · 解耦tokenizer): papers/1104-codebrain.md
      - 2026 · NeuroDETR (arXiv · 事件token化): papers/1104-neurodetr.md
      - 2026 · EEGArena (arXiv · 基准评测): papers/1104-eegarena.md
  - 模型架构基础:
      - LoRA · 低秩适配 (ICLR 2022): basics/lora.md
      - Attention 替代方案 (CS336 Lec 4): basics/attention-alternatives.md
      - 生成模型脉络 (VAE → DDPM → FM): basics/generative-lineage.md
      - 图神经网络 (消息传递与 GAT): basics/gnn.md
  - 主题专题:
      - EEG Tokenization 演进: topics/tokenization.md
      - 预训练范式对比: topics/pretraining.md
      - 通道适配与多任务学习: topics/multi-task.md
