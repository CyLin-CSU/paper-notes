site_name: Paper Notes · 论文阅读笔记
site_description: 我的论文精读总结库
repo_url: https://github.com/CyLin-CSU/paper-notes
repo_name: CyLin-CSU/paper-notes

hooks:
  - hooks.py
  - search_zh.py

validation:
  links:
    anchors: warn   # 严格构建下锚点缺失会报错，防止标题被吞后快捷入口失效

theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换亮色

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/load-mathjax.js
  - javascripts/giscus.js
  - javascripts/progress.js
  - javascripts/back-to-top.js

plugins:
  - search
  - meta
  - glightbox

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - abbr
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - toc:
      permalink: "#"

exclude_docs: |
  includes/
  **/.history/**

nav:
  - 首页: index.md
  - 论文笔记:
      - EEG 基础模型:
          - BIOT (NeurIPS 2023): papers/fm/biot.md
          - LaBraM (ICLR 2024): papers/fm/labram.md
          - EEGPT (NeurIPS 2024): papers/fm/eegpt.md
          - BrainGPT (arXiv 2024): papers/fm/braingpt.md
          - NeuroLM (ICLR 2025): papers/fm/neurolm.md
          - TFM-Tokenizer (ICLR 2026): papers/fm/tfm-tokenizer.md
          - CBraMod (ICLR 2025 · 十字交叉): papers/fm/cbramod.md
          - LUNA (NeurIPS 2025 · 拓扑无关): papers/fm/luna.md
          - REVE (NeurIPS 2025 · 61,415h + 4D位置编码): papers/fm/reve.md
          - EEGMoE (TNNLS 2026 · MoE): papers/fm/eegmoe.md
          - NeuroRVQ (arXiv 2025 · 多尺度RVQ): papers/fm/neurorvq.md
          - BrainRVQ (arXiv 2026 · 双域RVQ): papers/fm/brainrvq.md
          - CodeBrain (ICLR 2026 · 解耦tokenizer): papers/fm/codebrain.md
          - NeuroDETR (arXiv 2026 · 事件token化): papers/fm/neurodetr.md
          - Uni-NTFM (ICLR 2026): papers/fm/uni-ntfm.md
      - 生成式模型:
          - JET (ICML 2026 · EEG 生成): papers/generative/jet.md
          - EEGDM (arXiv 2026 · 扩散表征): papers/generative/eegdm.md
          - Not-All-EEG (arXiv 2026 · 流匹配生成): papers/generative/not-all-eeg.md
      - 相关研究:
          - Défossez 语音解码 (NMI 2023 · 轴线源头): papers/survey/defossez-speech.md
          - SSM2Mel (arXiv 2025 · 语音解码): papers/survey/ssm2mel.md
          - CrossPT-EEG (arXiv 2024 · 视觉解码基准): papers/survey/crosspt-eeg.md
          - GUIDED (arXiv 2024 · 视觉重建): papers/survey/guided.md
          - DELTA (NeurIPS WS 2025 · 掩码扩散EEG-to-Text): papers/survey/delta.md
          - EEGArena (arXiv 2026 · 基准评测): papers/survey/eegarena.md
          - LTFT (IEEE TETCI 2026 · 时频方法): papers/survey/learnable-tf.md
          - RF-GPT (arXiv 2026 · 跨领域): papers/survey/rf-gpt.md
          - NPI (Nature Methods 2025 · 连接组学): papers/survey/surrogate-brain.md
          - EEG FM 综述 (JNE 2025 · 预训练横评): papers/survey/yao-eegfm-survey.md
          - 表示学习与 FM 综述 (IEEE SPM 2025 · 拆解表): papers/survey/chen-representation-learning-review.md
