site_name: Paper Notes · 论文阅读笔记
site_description: 我的论文精读总结库
repo_url: https://github.com/CyLin-CSU/paper-notes
repo_name: CyLin-CSU/paper-notes

hooks:
  - hooks.py
  - search_zh.py

theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换亮色

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/load-mathjax.js
  - javascripts/giscus.js
  - javascripts/progress.js
  - javascripts/back-to-top.js
  - https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js

plugins:
  - search
  - meta
  - glightbox

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - abbr
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - toc:
      permalink: "#"

exclude_docs: |
  includes/

nav:
  - 首页: index.md
  - 论文笔记:
      - "2026-09":
          - 0918 · BIOT (NeurIPS 2023): papers/2026-09/0918-biot.md
          - 0918 · LaBraM (ICLR 2024): papers/2026-09/0918-labram.md
          - 0918 · EEGPT (NeurIPS 2024): papers/2026-09/0918-eegpt.md
          - 0918 · BrainGPT (arXiv 2024): papers/2026-09/0918-braingpt.md
          - 0918 · NeuroLM (ICLR 2025): papers/2026-09/0918-neurolm.md
          - 0918 · TFM-Tokenizer (ICLR 2026): papers/2026-09/0918-tfm-tokenizer.md
          - 0921 · RF-GPT (arXiv 2026 · 跨领域): papers/2026-09/0921-rf-gpt.md
  - 模型架构基础:
      - LoRA · 低秩适配 (ICLR 2022): basics/lora.md
  - 主题专题:
      - EEG Tokenization 演进: topics/tokenization.md
      - 预训练范式对比: topics/pretraining.md
      - 通道异构的四种解法: topics/spatial.md
      - EEG 预训练数据全景: topics/data-landscape.md
      - 多任务三条路线: topics/multi-task.md
      - 基座来源分析: topics/base-model.md
  - 综述: blog-2023-2026.md
  - 六篇方法对比: comparison.md
  - 索引:
      - 数据集索引: datasets.md
      - 参考文献索引: references.md
