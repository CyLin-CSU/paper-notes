site_name: Paper Notes · 论文阅读笔记
site_description: 我的论文精读总结库
repo_url: https://github.com/CyLin-CSU/paper-notes
repo_name: CyLin-CSU/paper-notes

hooks:
  - hooks.py
  - search_zh.py

theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换亮色

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/load-mathjax.js
  - javascripts/giscus.js
  - javascripts/progress.js
  - javascripts/back-to-top.js
  - https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js

plugins:
  - search
  - meta
  - glightbox

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - abbr
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - toc:
      permalink: "#"

exclude_docs: |
  includes/
  **/.history/**

nav:
  - 首页: index.md
  - 论文笔记:
      - BIOT (NeurIPS 2023): papers/biot.md
      - Défossez 语音解码 (NMI 2023 · 轴线源头): papers/defossez-speech.md
      - LaBraM (ICLR 2024): papers/labram.md
      - EEGPT (NeurIPS 2024): papers/eegpt.md
      - BrainGPT (arXiv 2024): papers/braingpt.md
      - GUIDED (arXiv 2024 · 视觉重建): papers/guided.md
      - CrossPT-EEG (arXiv 2024 · 视觉解码基准): papers/crosspt-eeg.md
      - NeuroLM (ICLR 2025): papers/neurolm.md
      - LUNA (NeurIPS 2025 · 拓扑无关): papers/luna.md
      - CBraMod (ICLR 2025 · 十字交叉): papers/cbramod.md
      - REVE (NeurIPS 2025 · 61,415h + 4D位置编码): papers/reve.md
      - SSM2Mel (arXiv 2025 · 语音解码): papers/ssm2mel.md
      - NPI (Nature Methods 2025 · 连接组学): papers/surrogate-brain.md
      - NeuroRVQ (arXiv 2025 · 多尺度RVQ): papers/neurorvq.md
      - DELTA (NeurIPS WS 2025 · 掩码扩散EEG-to-Text): papers/delta.md
      - TFM-Tokenizer (ICLR 2026): papers/tfm-tokenizer.md
      - RF-GPT (arXiv 2026 · 跨领域): papers/rf-gpt.md
      - JET (ICML 2026 · EEG 生成): papers/jet.md
      - EEGMoE (TNNLS 2026 · MoE): papers/eegmoe.md
      - EEGDM (arXiv 2026 · 扩散表征): papers/eegdm.md
      - Not-All-EEG (arXiv 2026 · 流匹配生成): papers/not-all-eeg.md
      - LTFT (IEEE TETCI 2026 · 时频方法): papers/learnable-tf.md
      - BrainRVQ (arXiv 2026 · 双域RVQ): papers/brainrvq.md
      - CodeBrain (ICLR 2026 · 解耦tokenizer): papers/codebrain.md
      - NeuroDETR (arXiv 2026 · 事件token化): papers/neurodetr.md
      - EEGArena (arXiv 2026 · 基准评测): papers/eegarena.md
  - 模型架构基础:
      - LoRA · 低秩适配 (ICLR 2022): basics/lora.md
      - Attention 替代方案 (CS336 Lec 4): basics/attention-alternatives.md
      - 生成模型脉络 (VAE → DDPM → FM): basics/generative-lineage.md
      - 图神经网络 (消息传递与 GAT): basics/gnn.md
  - 主题专题:
      - EEG Tokenization 演进: topics/tokenization.md
      - 预训练范式对比: topics/pretraining.md
      - 通道适配与多任务学习: topics/multi-task.md
      - EEG 预训练数据全景: topics/data-landscape.md
      - 基座来源分析: topics/base-model.md
  - 语音模型专题:
      - 语音解码与 Mel 谱建模: topics/speech-models.md
  - 综述: blog-2023-2026.md
  - 十四篇方法对比: comparison.md
  - 索引:
      - 数据集索引: datasets.md
      - 参考文献索引: references.md
